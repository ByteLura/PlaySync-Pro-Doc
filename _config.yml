# Site settings
title: PlaySync Pro
description: Professional Real-Time Play Mode Persistence & Balance Suite for Unity
url: "https://bytelura.github.io"
baseurl: "/PlaySync-Pro-Doc"

# Theme settings
remote_theme: just-the-docs/just-the-docs
theme: just-the-docs

# Color scheme (dark mode default with toggle)
color_scheme: dark

# Search configuration
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: true

# Navigation settings
heading_anchors: true

# Auxiliary links in the header
aux_links:
  "Unity Asset Store": "https://assetstore.unity.com/publishers/128366"
  "ByteLura Website": "https://bytelura.com"
  "GitHub Repository": "https://github.com/ByteLura/PlaySync-Pro-Doc"

# Callouts
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Pro Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# Footer content
footer_content: "Copyright &copy; 2026 ByteLura. Built for high-velocity Unity game developers. Distributed exclusively via Unity Asset Store."

# Markdown Processor
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-default-layout
